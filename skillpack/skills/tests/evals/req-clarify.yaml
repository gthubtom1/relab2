skill: req-clarify

positive:
  - 这个需求太笼统了，先帮我把验收标准定下来
  - 客户就说要个“好用的后台”，到底做成什么样才算做完？
  - 帮我写个 spec，把要做什么功能讲清楚再开工
  - 这个功能我该怎么验收？做到什么程度算做完
  - 需求还没讲清楚，先别写代码，帮我把边界和想问的问题列出来
  - 我老板给的这段话太模糊，你帮我拆成能判定通过与否的条目
  - 先确认需求再动手，把这个 feature 的 out-of-scope 也标出来
  - 这句口号型需求帮我把判据说清楚，换不出来就继续问问
  - 信息还缺好几条，别猜，帮我把待确认清单列出来

negative:
  - 需求已经定了，就是不知道从哪开始切第一刀，帮我设计最薄的那条链路    # → design-slice
  - 需求很清楚了，帮我把这个小功能直接写出来    # → implement-feature
  - 需求都定好了，给这个已有功能补几条单元测试    # → write-tests
  - 这 bug 一直报错复现不出来，帮我先复现再修    # → fix-bug
  - 帮我审一下这个 PR 能不能合    # → code-review
  - 这段代码有没有注入风险，帮我审计一下安全问题    # → code-audit
  - 先试试 sqlite 和 postgres 哪个合适，做个原型    # → spike
  - 需求都确认过了，帮我把这个功能提个 PR 交付出去    # → pr-ship
  - 更新一下 readme 和 changelog，文档跟代码对不上了    # → docs-changelog
  - 需求已经很清楚了，帮我写份渗透测试报告    # → docs-generator
