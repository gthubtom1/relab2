skill: implement-feature

positive:
  - 帮我把这个登录功能实现出来
  - 按定了的方案写代码，加个小模块
  - 实现这个接口，复用仓库里既有的写法
  - 帮我加一个表单页面
  - 把这个后台服务搭起来，一次只解决一件事
  - 帮我开发这个自动化脚本
  - 实现这个前端组件，跟现有模式保持一致
  - 给这个工具加个小功能，别顺手重构

negative:
  - 这个 bug 一直报错，帮我修了    # → fix-bug
  - 先试试这个方案行不行，做个用完即弃的原型    # → spike
  - 需求还很含糊，先帮我把验收标准定了    # → req-clarify
  - 要从哪开始切第一刀还没定，功能边界也不清，帮我设计最薄切片    # → design-slice
  - 给这个已有模块补单元测试    # → write-tests
  - 帮我审这个 PR 能不能合    # → code-review
  - 这段代码有没有注入漏洞，帮我做安全审计    # → code-audit
  - 帮我把这次加的功能提成 PR 交付    # → pr-ship
  - 更新 readme 和 changelog    # → docs-changelog
