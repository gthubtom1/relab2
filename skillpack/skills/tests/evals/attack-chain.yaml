skill: attack-chain
positive:
  - 这是个完整渗透项目，从外网一路打到域控，帮我编排一下
  - HW 演练，要出一条多阶段的完整攻击路径
  - 拿到 webshell 了，下一步往哪走，帮我规划
  - 外网打进内网，横向能走多远，帮我串起来
  - 从钓鱼邮件开始，最后拿下放核心数据的那台
  - 帮我复盘一条完整的攻击链，每一步都要有证据
  - 红队项目，从边界到内网横向，多阶段怎么分
  - 已经拿到一台机器，顺着它摸到里面放重要东西的那几台
  - 分阶段拿下目标，帮我排一下阶段和跳板
  - 机房被控之后，评估一下能摸到哪
negative:
  - 先用 nmap 帮我扫一下这个网段开了哪些端口  # → pentest-tools
  - 域内凭据拿到了，只需要用 impacket 做域内提权和横向  # → windows-ad
  - 目标就在 k8s 上，容器和元数据这块怎么打  # → cloud-k8s
  - 这个 Web 接口的越权帮我逐个验证  # → api-security
  - 域控打下来之后怎么绕过 EDR 落地持久化  # → edr-bypass-re
  - 帮我审下这个仓库代码有没有注入  # → code-audit
  - 这个 exe 的校验逻辑反编译看看  # → ida-reverse
  - 帮我写一条 Sigma 规则把这个 LOTL 行为捞出来  # → threat-hunting
  - 交报告前帮我审一下这个 case 的证据链全不全  # → case-review
  - 这个 kernel 内核漏洞的根因帮我复盘一下  # → kernel-exploit
