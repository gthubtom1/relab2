skill: design-slice

positive:
  - 这个功能要接进现有系统，我从哪开始切第一刀
  - 帮我切一条最小可用链路，先把端到端跑通
  - 先做哪一块比较好？想先搭个 walking skeleton
  - 架构怎么定？先给我个最薄的闭环就行
  - 这个新功能太大，帮我垂直切成能跑的最小切片
  - 从哪下手？先做哪一部分
  - 我要先跑通一条最小链路再横向长功能，帮我设计切片和接口契约
  - 这个 feature 的端到端最薄闭环怎么切，帮我列个切片清单

negative:
  - 需求还没定清，验收标准根本写不出来    # → req-clarify
  - 已经知道从哪下手了，帮我把这段功能代码写进去    # → implement-feature
  - 给这条已经跑通的链路补测试    # → write-tests
  - 先试试这个技术方案行不行，原型用完就扔    # → spike
  - 帮我审下这个 diff 能不能合    # → code-review
  - 先帮我把这个 bug 修了再往下做    # → fix-bug
  - 帮我画一张这个链路的流程图    # → diagram-generator
  - 帮我把这次的设计整理成一份正式文档交出去    # → docs-generator
  - 这段代码有没有越权，帮我审一下安全问题    # → code-audit
