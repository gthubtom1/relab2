skill: write-tests

positive:
  - 给这个函数补几条单元测试
  - 这条逻辑到底要不要写测试？
  - 测试怎么写才能只测行为不测实现
  - 帮我加个回归测试，防止以后又改坏
  - 这段代码的测试覆盖率跌了要不要补
  - 补测试，到底是测行为还是测实现
  - 给这个模块写集成测试
  - 这些测试老是跟着重构一起改，是不是耦合实现了
  - 新加的这个分支逻辑要活过今天，帮我补条最小测试

negative:
  - 怎么确认整个需求做完了，帮我跑一遍验收    # → verify-done
  - 先写个一次性原型验证方案，用完就扔    # → spike
  - 这段代码有没有安全漏洞，帮我审一下    # → code-audit
  - 这个失败的测试挂着好几天了，帮我修这个 bug    # → fix-bug
  - 帮我把这个功能实现出来，顺便把测试脚手架搭上    # → implement-feature
  - 测试要驱动真实浏览器才有意义，帮我自动化跑    # → browser-automation
  - 帮我审这个 PR 的代码质量，测试是不是跟改动同一个 CL    # → code-review
  - 改了构建命令，帮我把文档和变更记录同步一下    # → docs-changelog
