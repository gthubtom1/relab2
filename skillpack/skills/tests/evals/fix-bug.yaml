skill: fix-bug

positive:
  - 这个 bug 怎么修，先帮我复现一下
  - 程序一打开就崩溃，报错怎么定位
  - 修完又犯了，帮我找根因别压症状
  - 这个接口报错 500，帮我查
  - 页面白屏了，帮我排一下是哪里不对
  - 测试挂了，帮我看看是代码错还是测试写错
  - 这个异常抛出来定位不到，先帮我复现出稳定路径
  - 跑不起来了，先复现再改，别瞎猜

negative:
  - 这不是要修的报错，而是要加个新功能    # → implement-feature
  - 这不是 bug，结构不变只重构，行为要保持一样    # → implement-feature
  - 还没确定这是 bug，帮我确认需求到底做没做完    # → verify-done
  - 构建链和依赖版本乱掉了，帮我查第三方组件有没有漏洞    # → supply-chain-security
  - 这个报错像是被利用的漏洞，帮我做安全审计    # → code-audit
  - 这段代码是不是有注入，帮我审计一下    # → code-audit
  - 复现要看懂一个加壳二进制，得先逆向它    # → reverse-engineering
  - 别修了，先帮我审这个 PR 能不能合    # → code-review
